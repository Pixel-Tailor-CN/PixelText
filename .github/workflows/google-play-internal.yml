name: Google Play internal testing

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-publish:
    # 每次推送仅检查最后一个提交的信息，contains 不区分大小写。
    if: github.event.deleted == false && contains(github.event.head_commit.message, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 主分支发布任务共用队列，避免同时提交 Play 编辑事务。
    concurrency:
      group: google-play-internal
      cancel-in-progress: false
      queue: max

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要完整 commit 历史以正确生成 versionCode
          persist-credentials: false

      - name: Validate publishing secrets
        env:
          SIGN_KEY_STORE_BASE64: ${{ secrets.SIGN_KEY_STORE_BASE64 }}
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          for name in SIGN_KEY_STORE_BASE64 SIGN_KEY_STORE_PASSWORD SIGN_KEY_ALIAS SIGN_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [[ -z "${!name}" ]]; then
              echo "::error::missing required secret name=$name"
              exit 1
            fi
          done
          if ! printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | jq -e '.type == "service_account" and (.client_email | type == "string" and length > 0) and (.private_key | type == "string" and length > 0)' > /dev/null 2>&1; then
            echo "::error::invalid service account json"
            exit 1
          fi

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Sync bundled resources
        env:
          PIXEL_TEXT_HUB_BASE_URL: ${{ vars.PIXEL_TEXT_HUB_BASE_URL || 'https://pixeltext.api.mystery0.vip' }}
        shell: bash
        run: |
          set -euo pipefail

          BASE_URL="${PIXEL_TEXT_HUB_BASE_URL%/}"
          MANIFEST_URL="${BASE_URL}/api/v1/resources/manifest"
          ASSETS_DIR="app/src/main/assets"
          MANIFEST_FILE="$(mktemp)"

          fail() {
            echo "resource sync failed: $1" >&2
            exit 1
          }

          resolve_url() {
            local url="$1"
            if [[ "$url" == http://* || "$url" == https://* ]]; then
              echo "$url"
            else
              echo "${BASE_URL}/${url#/}"
            fi
          }

          download_artifact() {
            local name="$1"
            local url="$2"
            local target="$3"
            local expected_sha256="$4"
            local expected_size="$5"
            local artifact_url
            local actual_size
            local actual_sha256
            local normalized_expected_sha256

            artifact_url="$(resolve_url "$url")"
            echo "downloading ${name} url=${artifact_url}"
            mkdir -p "$(dirname "$target")"
            curl -fsSL --retry 10 --connect-timeout 30 --max-time 120 "$artifact_url" -o "$target"

            actual_size="$(wc -c < "$target" | tr -d '[:space:]')"
            if [[ "$actual_size" != "$expected_size" ]]; then
              fail "${name} size mismatch expected=${expected_size} actual=${actual_size}"
            fi

            actual_sha256="$(sha256sum "$target" | awk '{print $1}')"
            normalized_expected_sha256="$(echo "$expected_sha256" | tr '[:upper:]' '[:lower:]')"
            if [[ "$actual_sha256" != "$normalized_expected_sha256" ]]; then
              fail "${name} sha256 mismatch expected=${expected_sha256} actual=${actual_sha256}"
            fi

            echo "synced ${name} path=${target} size=${actual_size} sha256=${actual_sha256}"
          }

          trap 'rm -f "$MANIFEST_FILE"' EXIT

          echo "fetching resource manifest url=${MANIFEST_URL}"
          curl -fsSL --retry 10 --connect-timeout 30 --max-time 60 \
            -H "Accept: application/json" \
            "$MANIFEST_URL" \
            -o "$MANIFEST_FILE"

          RULES_VERSION="$(jq -er '.rules.version' "$MANIFEST_FILE")" || fail "rules artifact missing"
          RULES_URL="$(jq -er '.rules.downloadUrl' "$MANIFEST_FILE")" || fail "rules download url missing"
          RULES_SHA256="$(jq -er '.rules.sha256' "$MANIFEST_FILE")" || fail "rules sha256 missing"
          RULES_SIZE="$(jq -er '.rules.sizeBytes' "$MANIFEST_FILE")" || fail "rules size missing"

          SPAM_MODEL_VERSION="$(jq -er '.spamModel.version' "$MANIFEST_FILE")" || fail "spam model artifact missing"
          MODEL_URL="$(jq -er '.spamModel.model.downloadUrl' "$MANIFEST_FILE")" || fail "spam model download url missing"
          MODEL_SHA256="$(jq -er '.spamModel.model.sha256' "$MANIFEST_FILE")" || fail "spam model sha256 missing"
          MODEL_SIZE="$(jq -er '.spamModel.model.sizeBytes' "$MANIFEST_FILE")" || fail "spam model size missing"
          VOCAB_URL="$(jq -er '.spamModel.vocab.downloadUrl' "$MANIFEST_FILE")" || fail "vocab download url missing"
          VOCAB_SHA256="$(jq -er '.spamModel.vocab.sha256' "$MANIFEST_FILE")" || fail "vocab sha256 missing"
          VOCAB_SIZE="$(jq -er '.spamModel.vocab.sizeBytes' "$MANIFEST_FILE")" || fail "vocab size missing"

          download_artifact "rules" "$RULES_URL" "${ASSETS_DIR}/rules.json" "$RULES_SHA256" "$RULES_SIZE"
          download_artifact "spam model" "$MODEL_URL" "${ASSETS_DIR}/spam_classifier.tflite" "$MODEL_SHA256" "$MODEL_SIZE"
          download_artifact "vocab" "$VOCAB_URL" "${ASSETS_DIR}/vocab.txt" "$VOCAB_SHA256" "$VOCAB_SIZE"
          jq -n \
            --arg rulesVersion "$RULES_VERSION" \
            --arg spamModelVersion "$SPAM_MODEL_VERSION" \
            '{rulesVersion: $rulesVersion, spamModelVersion: $spamModelVersion}' \
            > "${ASSETS_DIR}/bundled_resource_versions.json"

          echo "resource sync completed rules_version=${RULES_VERSION} spam_model_version=${SPAM_MODEL_VERSION}"

      - name: Decode Keystore
        env:
          SIGN_KEY_STORE_BASE64: ${{ secrets.SIGN_KEY_STORE_BASE64 }}
        run: |
          printf '%s' "$SIGN_KEY_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Prepare release name
        id: release-metadata
        shell: python3 {0}
        run: |
          import os
          import subprocess
          import tomllib
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          versions = tomllib.loads(Path("gradle/libs.versions.toml").read_text(encoding="utf-8"))
          version = versions["versions"]["app-version"]
          version_code = subprocess.check_output(["git", "rev-list", "HEAD", "--count"], text=True).strip()
          ci_time = datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S")
          release_name = f"{version} ({version_code}) · CI {ci_time}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"name={release_name}\n")

      - name: Build Release Bundle
        env:
          SIGN_KEY_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGN_KEY_STORE_PASSWORD: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          SIGN_KEY_ALIAS: ${{ secrets.SIGN_KEY_ALIAS }}
          SIGN_KEY_PASSWORD: ${{ secrets.SIGN_KEY_PASSWORD }}
        run: chmod a+x ./gradlew && ./gradlew --no-daemon :app:bundleRelease

      - name: Publish to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: vip.mystery0.pixel.text
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ steps.release-metadata.outputs.name }}

      - name: Cleanup Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
