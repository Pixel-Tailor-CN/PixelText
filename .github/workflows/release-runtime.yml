name: Release runtime regression

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-35-release:
    if: github.event.action != 'closed'
    name: Minified ARM64 release on Android 15
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_SERIAL: emulator-5554
      SIGN_KEY_STORE_FILE: ${{ github.workspace }}/artifacts/ci-signing.jks
      SIGN_KEY_STORE_PASSWORD: android
      SIGN_KEY_ALIAS: ci
      SIGN_KEY_PASSWORD: android
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Record source and prepare disposable CI signing
        run: |
          mkdir -p artifacts
          { git rev-parse HEAD; git rev-parse HEAD^{tree}; uname -a; java -version; } > artifacts/source-and-runner.txt 2>&1
          keytool -genkeypair -keystore "$SIGN_KEY_STORE_FILE" -storepass android -keypass android -alias ci -dname 'CN=PixelText CI Only' -keyalg RSA -keysize 2048 -validity 2
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
      - name: Install official SDK and ARM-translating Android 15 image
        timeout-minutes: 10
        run: |
          set -o pipefail
          sdkmanager 'platform-tools' 'emulator' 'platforms;android-37.0' 'build-tools;36.0.0' 'system-images;android-35;google_apis;x86_64' 2>&1 | tee artifacts/sdk-install.log
      - name: Build actual minified release without app changes
        timeout-minutes: 23
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee artifacts/gradle.log
          APK=app/build/outputs/apk/release/app-release.apk
          sha256sum "$APK" > artifacts/apk-sha256.txt
          unzip -l "$APK" > artifacts/apk-contents.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > artifacts/apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" artifacts/apk-badging.txt
          test -s app/build/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt
          git diff --exit-code -- app gradle build.gradle.kts settings.gradle.kts signing.gradle
      - name: Build separate runtime probe from final R8 mapping
        run: bash .github/runtime/build_probe.sh "$GITHUB_WORKSPACE/artifacts/probe"
      - name: Boot KVM emulator and verify official ARM64 translation
        timeout-minutes: 7
        run: bash .github/runtime/start_emulator.sh
      - name: Exercise cold starts, permissions, backup and vCard runtime
        timeout-minutes: 12
        run: |
          set -o pipefail
          python3 .github/runtime/runtime_smoke.py --apk app/build/outputs/apk/release/app-release.apk --probe artifacts/probe/probe.apk 2>&1 | tee artifacts/runtime-smoke.log
      - name: Preserve default-disabled release and build controlled MMS release
        timeout-minutes: 15
        run: |
          set -o pipefail
          mkdir -p artifacts/default-release artifacts/mms-enabled
          cp app/build/outputs/apk/release/app-release.apk artifacts/default-release/
          cp app/build/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt artifacts/default-release/
          ./gradlew --no-daemon --console=plain --max-workers=1 -Ppixeltext.enableMmsSending=true :app:assembleRelease 2>&1 | tee artifacts/mms-enabled/gradle.log
          APK=app/build/outputs/apk/release/app-release.apk
          cp "$APK" artifacts/mms-enabled/
          cp app/build/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt artifacts/mms-enabled/
          sha256sum "$APK" > artifacts/mms-enabled/apk-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" > artifacts/mms-enabled/apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" artifacts/mms-enabled/apk-badging.txt
          grep -q 'MMS_SENDING_ENABLED = true' app/build/generated/source/buildConfig/release/vip/mystery0/pixel/text/BuildConfig.java
          git diff --exit-code -- app gradle build.gradle.kts settings.gradle.kts signing.gradle
      - name: Build independent synthetic MMS callback probe
        run: bash .github/runtime/build_mms_probe.sh "$GITHUB_WORKSPACE/artifacts/mms-probe"
      - name: Verify post-dispatch MMS recovery and composer without send permission
        timeout-minutes: 8
        run: |
          set -o pipefail
          python3 .github/runtime/mms_smoke.py --apk artifacts/mms-enabled/app-release.apk --probe artifacts/mms-probe/probe.apk 2>&1 | tee artifacts/mms-runtime-smoke.log
      - name: Collect final diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          timeout 15 adb devices -l > artifacts/adb-devices.txt 2>&1 || true
          timeout 15 adb logcat -b crash -d > artifacts/logcat-crash-final.txt 2>&1 || true
          timeout 15 adb emu kill || true
          rm -f "$SIGN_KEY_STORE_FILE"
      - name: Upload lightweight runtime diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-diagnostics-api35-${{ github.run_id }}
          path: |
            artifacts/mms-runtime/
            artifacts/runtime/
            artifacts/*runtime-smoke.log
            artifacts/source-and-runner.txt
            artifacts/adb-devices.txt
            artifacts/logcat-crash-final.txt
          if-no-files-found: error
          retention-days: 7
      - name: Upload synthetic-data validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-runtime-api35-${{ github.run_id }}
          path: |
            artifacts/
            app/build/outputs/apk/release/*.apk
            app/build/intermediates/mapping/release/minifyReleaseWithR8/mapping.txt
          if-no-files-found: error
          retention-days: 7

  cleanup-pr17-branch:
    # 用户仅授权本修复分支合并后的清理；不能把范围扩大到其他 PR。
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.number == 17 && github.event.pull_request.merged == true &&
      github.repository == 'Pixel-Tailor-CN/PixelText' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/r8-backup-vcard-reflection'
    name: Delete only merged PR17 temporary branch
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: Pixel-Tailor-CN/PixelText
      BRANCH: fix/r8-backup-vcard-reflection
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      EXPECTED_MERGE: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Verify merge and exact branch before deletion
        shell: bash
        run: |
          set -euo pipefail
          API="repos/$REPO"
          DEFAULT_BRANCH=$(gh api "$API" --jq .default_branch)
          test "$BRANCH" != "$DEFAULT_BRANCH"
          test "$BRANCH" != main
          test "$BRANCH" != master
          PR=$(gh api "$API/pulls/17")
          jq -e --arg repo "$REPO" --arg branch "$BRANCH" --arg head "$EXPECTED_HEAD" --arg merge "$EXPECTED_MERGE" '
            .number == 17 and .merged == true and .state == "closed" and
            .head.repo.full_name == $repo and .head.ref == $branch and
            .head.sha == $head and .merge_commit_sha == $merge
          ' <<< "$PR"
          # 只允许删除 refs/heads 下这个明确的临时分支，保留默认分支及全部标签。
          REF="$(gh api "$API/git/ref/heads/$BRANCH")"
          jq -e --arg ref "refs/heads/$BRANCH" --arg head "$EXPECTED_HEAD" '
            .ref == $ref and .object.type == "commit" and .object.sha == $head
          ' <<< "$REF"
          gh api --method DELETE "$API/git/refs/heads/$BRANCH"
          set +e
          gh api --include "$API/git/ref/heads/$BRANCH" > "$RUNNER_TEMP/pr17-ref-after.txt" 2>&1
          STATUS=$?
          set -e
          test "$STATUS" -ne 0
          grep -Eq '^HTTP[^ ]* 404|\(HTTP 404\)' "$RUNNER_TEMP/pr17-ref-after.txt"
          echo "deleted only refs/heads/$BRANCH at merged head $EXPECTED_HEAD" >> "$GITHUB_STEP_SUMMARY"
